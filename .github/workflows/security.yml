name: security

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  dependencies-analysis:
    name: Dependencies Analysis
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.5
    with:
      scan-args: |-
        --recursive
        ./
      results-file-name: DependenciesAnalysisFull.sarif
      fail-on-vuln: false
